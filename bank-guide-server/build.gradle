plugins {
    id 'java'
    id 'org.springframework.boot' version '3.5.6'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.example'
version = '0.0.1'

java {
    sourceCompatibility = JavaVersion.VERSION_17
}

repositories {
    mavenCentral()
}

dependencyManagement {
    imports {
        // Spring AI 1.1.x는 Spring Boot 3.4 / 3.5와 함께 쓴다 (Spring AI 2.x는 Boot 4 필요)
        mavenBom 'org.springframework.ai:spring-ai-bom:1.1.5'
    }
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'

    // 3단계: LLM 의도 분류 (OpenAI). 다른 LLM을 쓰려면 이 줄과 application.yml만 바꾸면 된다.
    implementation 'org.springframework.ai:spring-ai-starter-model-openai'

    // 키 없이 로컬에서 시험하는 Ollama. 기본은 OpenAI이고, `ollama` 프로필로 실행하면 이쪽을 쓴다.
    implementation 'org.springframework.ai:spring-ai-starter-model-ollama'

    // 기본은 H2(설치 필요 없는 메모리 DB), mysql 프로필로 실행하면 MySQL 사용
    runtimeOnly 'com.h2database:h2'
    runtimeOnly 'com.mysql:mysql-connector-j'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

// Windows 기본 인코딩(MS949)에서 한글·베트남어·중국어 문자열이 깨지지 않도록
tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

tasks.named('test') {
    useJUnitPlatform()
}
