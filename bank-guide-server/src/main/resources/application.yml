server:
  port: 8080
  error:
    include-message: always   # "안내 세션이 없습니다" 같은 오류 문구를 화면에 전달

spring:
  # 기본: H2 메모리 DB (설치 없이 바로 실행, 서버를 끄면 데이터가 사라짐)
  datasource:
    url: jdbc:h2:mem:guide;MODE=MySQL;DB_CLOSE_DELAY=-1   # 마지막 연결이 닫혀도 서버가 켜져 있는 동안 DB를 유지
    username: sa
    password:
  h2:
    console:
      enabled: true          # http://localhost:8080/h2-console 에서 테이블 확인
  jpa:
    hibernate:
      ddl-auto: none         # 테이블은 schema.sql로 직접 만든다
    open-in-view: false
    show-sql: true
  sql:
    init:
      mode: always           # 서버 시작 시 schema.sql → data.sql 실행
      encoding: UTF-8

  # 3단계: LLM 의도 분류
  ai:
    model:
      chat: openai   # 두 LLM이 함께 들어 있어서 하나만 켠다. ollama 프로필(application-ollama.yml)에서 ollama로 바뀐다
      embedding: none   # 임베딩은 쓰지 않는다 (OpenAI·Ollama 임베딩 모델이 둘 다 만들어지는 것 방지)
    openai:
      # IntelliJ Run Configuration → Environment variables에 OPENAI_API_KEY=sk-... 입력
      # 키가 없거나 호출이 실패하면 서버는 키워드 분류로 대신 동작한다
      api-key: ${OPENAI_API_KEY:no-key}
      chat:
        options:
          model: gpt-5-mini
          temperature: 1.0           # gpt-5 계열은 1.0만 허용
          reasoning-effort: minimal  # 분류는 깊게 생각할 필요가 없어서 응답을 빠르게
    # [데모용 설정] 시연 중 LLM 장애로 화면이 멈추지 않게, 재시도 없이 빨리 대체 동작으로 넘어가도록 정한 값.
    # 실제 서비스에서는 일시 오류(요청 한도 초과, 5xx)에 짧게 재시도하고, 호출별(분류·요약·번역) 대기 시간을 따로 정한다.
    # LLM이 안 될 때 오래 기다리지 않고 키워드 분류·규칙 요약으로 넘어가게 한다.
    # 기본값(최대 10번, 2초→10초→50초→3분 간격)이면 장애 때 상담원 연결이 몇 분씩 멈춘다.
    # 다시 시도하면 응답 없는 LLM을 read-timeout만큼 한 번 더 기다리므로 (2번이면 약 22초) 다시 시도하지 않는다
    retry:
      max-attempts: 1
      backoff:                     # max-attempts가 1이라 쓰이지 않지만, 값이 잘못되면 서버가 뜨지 않는다
        initial-interval: 500ms
        multiplier: 2              # Spring Retry 제약: 배수는 1보다, 최대 간격은 시작 간격보다 커야 한다
        max-interval: 1s

  # [데모용 설정] LLM 호출(RestClient)의 대기 시간. 응답이 없으면 실패로 보고 대체 동작으로 넘어간다.
  # 이 값은 서버의 모든 RestClient에 적용되므로, 실제 서비스에서 다른 외부 API를 부르게 되면 따로 나눠야 한다
  http:
    client:
      connect-timeout: 3s
      read-timeout: 10s            # 분류·요약·번역은 보통 몇 초 안에 끝난다

# 가입 자격 판단(데모용 가상 규칙)의 기준일. 비우면 실제 오늘 날짜.
# 시연 결과를 고정하려면 2026-10-27처럼 넣는다 (환경변수 DEMO_TODAY도 가능)
demo:
  today: ${DEMO_TODAY:}

logging:
  level:
    com.example.bankguide: INFO      # 콘솔에서 [LLM 분류] 로그 확인

---
# MySQL로 실행: Run Configuration의 Active profiles에 mysql 입력
spring:
  config:
    activate:
      on-profile: mysql
  datasource:
    url: jdbc:mysql://localhost:3306/bank_guide?createDatabaseIfNotExist=true&serverTimezone=Asia/Seoul&characterEncoding=UTF-8
    username: root
    password: ${MYSQL_PASSWORD}
